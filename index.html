<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的戀人</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#F6F3EB; --ink:#1A1A1A; --line:rgba(0,0,0,0.08); }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Newsreader", serif; font-weight:300; -webkit-font-smoothing: antialiased; }
  header{ padding: 22px 28px; border-bottom:1px solid var(--line); font-size:12px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.5; }
  .wrap{ max-width: 860px; margin: 0 auto; padding: 0 28px; }
  h1{ margin: 80px 0 40px 0; line-height:0.9; }
  h1 img{ height: 272px; width:auto; max-width:100%; display:block; }
  .flip-card{ background: transparent; width:100%; perspective: 1200px; margin-bottom:28px; }
  .flip-inner{ position:relative; width:100%; transition: transform 0.9s cubic-bezier(0.4,0,0.2,1); transform-style: preserve-3d; }
  .flip-card.flipped .flip-inner{ transform: rotateY(180deg); }
  .flip-front, .flip-back{ width:100%; backface-visibility: hidden; background: white; border: 1px solid var(--line); padding: 16px; box-shadow: 0 1px 0 var(--line), 0 20px 50px rgba(0,0,0,0.07); }
  .flip-front{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 80px 16px 60px; }
  .flip-back{ position:absolute; top:0; left:0; transform: rotateY(180deg); }
  .flip-back img{ display:block; width:100%; height:auto; }
  .meta{ display:flex; justify-content:space-between; padding-top:14px; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.4; }
  .heart{ cursor:pointer; display:inline-block; animation: float 3s ease-in-out infinite; }
  .heart img{ width:62px; height:auto; display:block; }
  @keyframes float{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-12px); } }
  .tap{ font-style:italic; font-size:15px; opacity:0.5; margin-top:20px; letter-spacing:0.02em; }
  footer{ margin: 90px 0 60px 0; opacity:0.3; font-size:13px; }
  @media(max-width:600px){ h1 img{ height: 180px; } }
</style>
</head>
<body>
<header>ameiy — 2025</header>
<div class="wrap">
  <h1><img src="formylover.png" alt="戀人"></h1>

  <div class="flip-card" id="flipCard">
    <div class="flip-inner">
      <div class="flip-front">
        <div class="heart" id="heart"><img src="heart1.png" alt="heart"></div>
        <div class="tap">tap my heart ♡</div>
      </div>
      <div class="flip-back">
        <img src="tempelhof-full.jpg" alt="Tempelhof drawing">
        <div class="meta"><span>Tempelhof Feld, Berlin</span><span>2025</span></div>
      </div>
    </div>
  </div>

  <footer>© Lai</footer>
</div>

<audio id="bgm" loop>
  <source src="ionlycareaboutyou.mp3" type="audio/mpeg">
</audio>

<script>
  const audio = document.getElementById('bgm');
  const heart = document.getElementById('heart');
  const flipCard = document.getElementById('flipCard');

  heart.onclick = () => {
    audio.play().catch(()=>{});
    heart.style.transition = 'all 0.5s ease';
    heart.style.transform = 'scale(1.6)';
    heart.style.opacity = '0';
    setTimeout(()=>{ flipCard.classList.add('flipped'); }, 400);
  }
</script>
</body>
</html>
