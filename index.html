<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的戀人</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#F8F5EB;color:#1A1A1A;font-family:"Newsreader",serif;font-weight:300;overflow-x:hidden;min-height:100vh}
.video-bg{position:fixed;left:0;top:0;width:50vw;height:100vh;z-index:0;background:#000;overflow:hidden}
.video-bg video{width:100%;height:100%;object-fit:cover;filter:brightness(1.35) contrast(1.05) saturate(1.1);display:block}
.video-bg::after{content:"";position:absolute;right:0;top:0;bottom:0;width:120px;background:linear-gradient(to right,transparent,rgba(248,245,235,.9));z-index:1}
.washi-overlay{position:fixed;inset:0;z-index:1;pointer-events:none;background:#F3EFE2 url(https://www.transparenttextures.com/patterns/rice-paper-3.png);opacity:.6}
.washi-overlay::after{content:"";position:absolute;inset:0;background:url(https://www.transparenttextures.com/patterns/rice-paper-2.png);opacity:.3;mix-blend-mode:multiply}
.warm-wash{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 30% 20%,rgba(255,248,220,.2),transparent 70%);opacity:.5}
.flowers{position:fixed;inset:0;z-index:3;pointer-events:none}
.flower{position:absolute;top:-20%;opacity:.9}
.f1{left:8%;width:72px;animation:fallA 16s linear infinite}.f2{left:22%;width:88px;animation:fallB 19s linear infinite 2s}.f3{left:38%;width:64px;animation:fallA 15s linear infinite 4s}.f4{left:55%;width:95px;animation:fallB 18s linear infinite 1s}.f5{left:72%;width:70px;animation:fallA 17s linear infinite 6s}.f6{left:85%;width:82px;animation:fallB 16s linear infinite 3s}.f7{left:15%;width:60px;animation:fallA 20s linear infinite 7s}.f8{left:92%;width:78px;animation:fallB 19s linear infinite 5s}
@keyframes fallA{0%{transform:translate3d(0,-25vh,0) rotate(0deg);opacity:0}10%{opacity:.9}50%{transform:translate3d(25px,45vh,0) rotate(60deg)}90%{opacity:.9}100%{transform:translate3d(-10px,115vh,0) rotate(120deg);opacity:0}}
@keyframes fallB{0%{transform:translate3d(0,-25vh,0) rotate(0deg);opacity:0}10%{opacity:.9}50%{transform:translate3d(-30px,50vh,0) rotate(-50deg)}90%{opacity:.9}100%{transform:translate3d(15px,115vh,0) rotate(-110deg);opacity:0}}
.wrap{position:relative;z-index:2;max-width:860px;margin:0 auto;padding:0 28px}
h1{margin:80px 0 40px}h1 img{height:272px;width:auto;display:block}
.flip-card{width:100%;height:460px;perspective:1200px;margin-bottom:28px;cursor:pointer}
.flip-inner{width:100%;height:100%;transition:transform .9s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;position:relative}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.flip-front,.flip-back{width:100%;height:100%;backface-visibility:hidden;background:rgba(255,253,248,.82);backdrop-filter:blur(12px);border:1px solid rgba(0,0,0,.06);padding:16px;box-shadow:0 25px 60px rgba(139,115,85,.15);position:absolute;inset:0;overflow:hidden}
.flip-front{display:flex;flex-direction:column;align-items:center;justify-content:center}
.flip-back{transform:rotateY(180deg);display:flex;flex-direction:column}
.flip-back img{width:100%;height:100%;object-fit:cover;flex:1;display:block}
.meta{display:flex;justify-content:space-between;padding-top:14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.4}
.heart{animation:float 3s ease-in-out infinite;transition:.5s}.heart img{width:62px}.heart.hidden{transform:scale(1.6);opacity:0}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.tap{font-style:italic;font-size:15px;opacity:.5;margin-top:20px}
footer{position:fixed;bottom:20px;left:28px;z-index:5;opacity:.4;font-size:13px}
@media(max-width:900px){.video-bg{width:100vw;opacity:.6}h1 img{height:180px}.flip-card{height:380px}}
</style>
</head>
<body>
<div class="video-bg"><video autoplay muted loop playsinline><source src="your-light-video.mp4" type="video/mp4"></video></div>
<div class="washi-overlay"></div><div class="warm-wash"></div>
<div class="flowers"><img src="flower1.png" class="flower f1"><img src="flower2.png" class="flower f2"><img src="flower1.png" class="flower f3"><img src="flower2.png" class="flower f4"><img src="flower1.png" class="flower f5"><img src="flower2.png" class="flower f6"><img src="flower1.png" class="flower f7"><img src="flower2.png" class="flower f8"></div>
<div class="wrap"><h1><img src="formylover.png" alt="戀人"></h1><div class="flip-card" id="flipCard"><div class="flip-inner"><div class="flip-front"><div class="heart" id="heart"><img src="heart1.png"></div><div class="tap">tap my heart ♡</div></div><div class="flip-back"><img src="tempelhof-full.jpg"><div class="meta"><span>Tempelhof Feld, Berlin</span><span>2025</span></div></div></div></div></div>
<footer>© Lai</footer>
<audio id="bgm" loop><source src="ionlycareaboutyou.mp3" type="audio/mpeg"></audio>
<script>const a=document.getElementById('bgm'),h=document.getElementById('heart'),c=document.getElementById('flipCard');let p=!1;c.onclick=()=>{if(!p){a.play().catch(()=>{});p=!0;h.classList.add('hidden');setTimeout(()=>c.classList.add('flipped'),300)}else{if(c.classList.contains('flipped')){c.classList.remove('flipped');setTimeout(()=>h.classList.remove('hidden'),400)}else{h.classList.add('hidden');setTimeout(()=>c.classList.add('flipped'),300)}}}</script>
</body>
</html>
