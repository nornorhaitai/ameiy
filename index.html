<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的戀人</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#F6F3EB; --ink:#1A1A1A; --line:rgba(0,0,0,0.08); }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Newsreader", serif; font-weight:300; -webkit-font-smoothing: antialiased; }
  header{ display:flex; justify-content:space-between; align-items:center; padding: 22px 28px; border-bottom:1px solid var(--line); font-size:12px; letter-spacing:0.14em; text-transform:uppercase; }
  header span{ opacity:0.5; }
  .wrap{ max-width: 860px; margin: 0 auto; padding: 0 28px; }
  h1{ margin: 80px 0 16px 0; line-height:0.9; }
  h1 img{ height: 68px; width:auto; display:block; }
  .sub{ max-width: 360px; font-size:17px; line-height:1.5; opacity:0.55; margin-bottom: 28px; }
  .game{ background: white; border: 1px solid var(--line); padding: 24px 16px 16px; box-shadow: 0 1px 0 var(--line), 0 20px 50px rgba(0,0,0,0.07); text-align:center; margin-bottom: 28px; }
  .game-hint{ font-size:11px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.3; margin-bottom: 20px; }
  .heart{ cursor:pointer; display:inline-block; animation: float 3s ease-in-out infinite; }
  .heart img{ width:58px; height:auto; display:block; }
  @keyframes float{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-12px); } }
  .letter{ display:none; font-style:italic; font-size:16px; line-height:1.7; opacity:0.7; margin-top:20px; }
  .play-btn{ border:1px solid var(--ink); background:transparent; color:var(--ink); font-family:"Newsreader", serif; font-style:italic; font-size:13px; padding:8px 22px; border-radius:999px; cursor:pointer; margin-top:16px; }
  .play-btn:hover{ background:var(--ink); color:white; }
  .art{ background: white; border: 1px solid var(--line); padding: 16px; box-shadow: 0 1px 0 var(--line), 0 20px 50px rgba(0,0,0,0.07); }
  .art img{ display:block; width:100%; height:auto; }
  .meta{ display:flex; justify-content:space-between; padding-top:14px; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.4; }
  .music-title{ margin-top:28px; font-style:italic; font-size:14px; opacity:0.5; }
  footer{ margin: 90px 0 60px 0; opacity:0.3; font-size:13px; }
</style>
</head>
<body>
<header><span>ameiy — 2025</span><span>戀人</span></header>
<div class="wrap">
  <h1><img src="formylover.png" alt="戀人"></h1>
  <div class="sub">Tempelhof, Berlin.</div>

  <div class="game">
    <div class="game-hint">my heart — catch it</div>
    <div class="heart" id="heart"><img src="heart1.png" alt="heart"></div>
    <div class="letter" id="letter">You caught it.<br><br>I only care about you.<br>— Lai ♡</
