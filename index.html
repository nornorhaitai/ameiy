<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的戀人</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300&display=swap" rel="stylesheet">
<style>
  :root{ --line:rgba(0,0,0,0.08); --ink:#1A1A1A; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#F8F5EB; color:var(--ink); font-family:"Newsreader", serif; font-weight:300; overflow-x:hidden; }
  
  .video-bg{ position:fixed; inset:0; z-index:0; background:#F8F5EB; }
  .video-bg video{ width:100%; height:100%; object-fit:cover; opacity:0.55; filter: contrast(1.2) brightness(1.3) saturate(0.7); mix-blend-mode:multiply; }
  .washi-overlay{ position:fixed; inset:0; z-index:1; pointer-events:none; background-color:#F8F5EB; background-image:url(https://www.transparenttextures.com/patterns/rice-paper-3.png); opacity:0.72; }
  .warm-wash{ position:fixed; inset:0; z-index:1; pointer-events:none; background: radial-gradient(ellipse at 30% 20%, rgba(255,248,220,0.5) 0%, transparent 65%), rgba(248,245,235,0.2); mix-blend-mode: soft-light; opacity:0.6; }

  .flowers{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .flower{ position:absolute; top:-10%; width:38px; height:auto; opacity:0.7; animation: fall linear infinite; }
  .f1{ left:18%; animation: fall1 18s linear infinite; width:32px; }
  .f2{ left:72%; animation: fall2 24s linear infinite 4s; width:42px; }
  @keyframes fall1{ 0%{transform:translateY(-10vh) translateX(0) rotate(0deg);}25%{transform:translateY(25vh) translateX(20px) rotate(45deg);}50%{transform:translateY(50vh) translateX(-15px) rotate(90deg);}75%{transform:translateY(75vh) translateX(25px) rotate(135deg);}100%{transform:translateY(110vh) translateX(10px) rotate(180deg);} }
  @keyframes fall2{ 0%{transform:translateY(-10vh) translateX(0) rotate(0deg);}25%{transform:translateY(30vh) translateX(-30px) rotate(-30deg);}50%{transform:translateY(60vh) translateX(20px) rotate(-60deg);}75%{transform:translateY(85vh) translateX(-10px) rotate(-100deg);}100%{transform:translateY(110vh) translateX(30px) rotate(-150deg);} }

  header{ position:relative; z-index:2; padding:22px 28px; border-bottom:1px solid var(--line); font-size:12px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.45; }
  .wrap{ position:relative; z-index:2; max-width:860px; margin:0 auto; padding:0 28px; }
  h1{ margin:80px 0 40px; line-height:0.9; } h1 img{ height:272px; width:auto; display:block; }
  .flip-card{ width:100%; perspective:1200px; margin-bottom:28px; cursor:pointer; position:relative; }
  .flip-inner{ position:relative; width:100%; transition: transform 0.9s cubic-bezier(0.4,0,0.2,1); transform-style:preserve-3d; display:grid; }
  .flip-card.flipped .flip-inner{ transform:rotateY(180deg); }
  .flip-front,.flip-back{ grid-area:1/1; width:100%; backface-visibility:hidden; background:rgba(255,253,248,0.78); backdrop-filter:blur(16px); border:1px solid rgba(0,0,0,0.05); padding:16px; box-shadow:0 25px 60px rgba(139,115,85,0.15); aspect-ratio: 1.4/1; }
  .flip-front{ display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:2; }
  .flip-back{ transform:rotateY(180deg); display:flex; flex-direction:column; }
  .flip-back img{ width:100%; height:100%; object-fit:contain; display:block; }
  .meta{ display:flex; justify-content:space-between; padding-top:14px; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.4; margin-top:auto; }
  .heart{ animation: float 3s ease-in-out infinite; transition:0.5s; } .heart img{ width:62px; } .heart.hidden{ transform:scale(1.6); opacity:0; }
  @keyframes float{ 0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);} }
  .tap{ font-style:italic; font-size:15px; opacity:0.5; margin-top:20px; }
  footer{ position:relative; z-index:2; margin:90px 0 60px; opacity:0.3; font-size:13px; }
  @media(max-width:600px){ h1 img{ height:180px; } }
</style>
</head>
<body>
<div class="video-bg"><video autoplay muted loop playsinline><source src="your-light-video.mp4" type="video/mp4"></video></div>
<div class="washi-overlay"></div>
<div class="warm-wash"></div>
<div class="flowers"><img src="flower1.png" class="flower f1"><img src="flower2.png" class="flower f2"></div>

<header>ameiy — 2025</header>
