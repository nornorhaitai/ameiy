<!DOCTYPE html>
<html>
<head>
    <title>我的戀人</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
    <style>
      /* --- Tempelhof Interactive Piece --- */
      .tempelhof-wrap{
        background:#d8d5a5;
        padding: 50px 20px;
        display:flex;
        justify-content:center;
        margin: 40px 0;
      }
      .scene{
        position:relative;
        width: 900px;
        max-width: 100%;
        aspect-ratio: 1.45 / 1;
        background: #4f7e6e;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 0 0 14px #d8d5a5;
        /* wavy edge */
        clip-path: polygon(
          1% 5%, 3% 3%, 7% 4%, 11% 2%, 16% 4%, 22% 3%, 28% 5%, 33% 2%, 39% 4%, 44% 2%, 50% 4%, 56% 2%, 62% 5%, 68% 2%, 74% 4%, 81% 2%, 87% 4%, 93% 3%, 98% 5%,
          98% 94%, 93% 97%, 87% 95%, 81% 98%, 74% 95%, 68% 98%, 62% 95%, 56% 97%, 50% 94%, 44% 98%, 38% 95%, 32% 97%, 26% 94%, 19% 97%, 12% 94%, 5% 97%, 1% 94%
        );
      }
      .base-img{
        width:100%; height:100%; object-fit:cover; display:block;
      }
      .handwritten{
        position:absolute; top:8%; right:6%;
        font-family: "Caveat", cursive; color:#e8e6c8;
        font-size: 28px; transform: rotate(-2deg);
      }
      .dancer{
        position:absolute;
        cursor:pointer;
        animation: sway 2.2s ease-in-out infinite;
        transform-origin: bottom center;
      }
      .dancer-left{
        width: 18%; left: 11%; bottom: 6%;
        animation-delay: -0.3s;
      }
      .dancer-right{
        width: 22%; right: 15%; bottom: 18%;
        animation-duration: 2.6s;
      }
      .dancer img{ width:100%; display:block; }

      @keyframes sway{
        0%,100%{ transform: rotate(-2deg) translateY(0); }
        25%{ transform: rotate(2deg) translateY(-3px); }
        50%{ transform: rotate(-1.5deg) translateY(-6px); }
        75%{ transform: rotate(1.5deg) translateY(-2px); }
      }
      .dancer:hover{ transform: scale(1.15) rotate(3deg) !important; }
      .dancer.is-dancing{ animation: wiggle 0.3s ease-in-out 4; }

      @keyframes wiggle{
        0%,100%{ transform: rotate(-5deg) translateY(-8px); }
        50%{ transform: rotate(5deg) translateY(-4px); }
      }
    </style>
</head>

<body>

    <h1>戀人</h1>
    <p>This is my first website.</p>

    <!-- PASTE YOUR DRAWING HERE - it will sit under your text -->
    <div class="tempelhof-wrap">
      <div class="scene">
        <!-- 1. This is the full building -->
        <img src="tempelhof-full.jpg" class="base-img" alt="Tempelhof 25 Free Gaza" />
        
        <!-- 2. Dancer left (pink) -->
        <div class="dancer dancer-left">
          <img src="dancer_left.png" alt="person waving" />
        </div>

        <!-- 3. Dancer right (yellow) -->
        <div class="dancer dancer-right">
          <img src="dancer_right.png" alt="person at table" />
        </div>

        <span class="handwritten">TEMPELHOF '25</span>
      </div>
    </div>

    <script>
      document.querySelectorAll('.dancer').forEach(d=>{
        d.addEventListener('click', ()=>{
          d.classList.remove('is-dancing');
          void d.offsetWidth;
          d.classList.add('is-dancing');
        });
      });
    </script>

</body>
</html>
