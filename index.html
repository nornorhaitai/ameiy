<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的戀人</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#F8F5EB;color:#1A1A1A;font-family:"Newsreader",serif;font-weight:300;overflow-x:hidden;min-height:100vh}
.video-bg{position:fixed;left:0;top:0;width:50vw;height:100vh;z-index:0;background:#000;overflow:hidden}
.video-bg video{width:100%;height:100%;object-fit:cover;opacity:.95}
.video-bg::after{content:"";position:absolute;right:0;top:0;bottom:0;width:180px;background:linear-gradient(to right,transparent,#F8F5EB);z-index:1}
.washi-overlay{position:fixed;inset:0;z-index:1;pointer-events:none;background-color:#F3EFE2;background-image:url(https://www.transparenttextures.com/patterns/rice-paper-3.png);opacity:1}
.washi-overlay::after{content:"";position:absolute;inset:0;background-image:url(https://www.transparenttextures.com/patterns/rice-paper-2.png);opacity:.6;mix-blend-mode:multiply}
.warm-wash{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 30% 20%,rgba(255,248,220,.3) 0%,transparent 70%)}
.wrap{position:relative;z-index:2;max-width:860px;margin:0 auto;padding:0 28px}
h1{margin:80px 0 40px}h1 img{height:272px;width:auto;display:block}
.flip-card{width:100%;perspective:1200px;margin-bottom:28px;cursor:pointer}.flip-inner{position:relative;width:100%;transition:transform .9s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.flip-front,.flip-back{width:100%;backface-visibility:hidden;background:rgba(255,253,248,.82);backdrop-filter:blur(12px);border:1px solid rgba(0,0,0,.06);padding:16px;box-shadow:0 25px 60px rgba(139,115,85,.15);position:relative;overflow:hidden}
.flip-front{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 16px 60px}
.card-flowers{position:absolute;inset:0;z-index:0;pointer-events:none}.card-flowers img{position:absolute;opacity:.95}
.cf1{left:-15px;top:5px;width:120px;transform:rotate(-18deg)}.cf2{right:-20px;top:25px;width:140px;transform:rotate(22deg)}.cf3{left:15%;bottom:-25px;width:110px;transform:rotate(12deg)}.cf4{right:10%;bottom:5px;width:105px;transform:rotate(-12deg)}.cf5{left:42%;top:15px;width:75px;opacity:.7}.cf6{left:-10px;bottom:30%;width:95px;transform:rotate(35deg)}.cf7{right:30%;top:-15px;width:85px;transform:rotate(-25deg)}.cf8{left:35%;bottom:-15px;width:100px;transform:rotate(8deg)}
.flip-front>*:not(.card-flowers){position:relative;z-index:2}
.flip-back{position:absolute;top:0;left:0;transform:rotateY(180deg)}.flip-back img{width:100%;display:block}
.meta{display:flex;justify-content:space-between;padding-top:14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.4}
.heart{animation:float 3s ease-in-out infinite;transition:.5s}.heart img{width:62px}.heart.hidden{transform:scale(1.6);opacity:0}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.tap{font-style:italic;font-size:15px;opacity:.5;margin-top:20px}
footer{position:fixed;bottom:20px;left:28px;z-index:5;opacity:.4;font-size:13px}
@media(max-width:900px){.video-bg{width:100vw;opacity:.45}h1 img{height:180px}}
</style>
</head>
<body>
<div class="video-bg"><video autoplay muted loop playsinline><source src="your-light-video.mp4" type="video/mp4"></video></div>
<div class="washi-overlay"></div><div class="warm-wash"></div>
<div class="wrap">
<h1><img src="formylover.png" alt="戀人"></h1>
<div class="flip-card" id="flipCard"><div class="flip-inner">
<div class="flip-front">
<div class="card-flowers">
<img src="flower1.png" class="cf1"><img src="flower2.png" class="cf2"><img src="flower1.png" class="cf3"><img src="flower2.png" class="cf4"><img src="flower1.png" class="cf5"><img src="flower2.png" class="cf6"><img src="flower1.png" class="cf7"><img src="flower2.png" class="cf8">
</div>
<div class="heart" id="heart"><img src="heart1.png"></div><div class="tap">tap my heart ♡</div>
</div>
<div class="flip-back"><img src="tempelhof-full.jpg"><div class="meta"><span>Tempelhof Feld, Berlin</span><span>2025</span></div></div>
</div></div>
</div>
<footer>© Lai</footer>
<audio id="bgm" loop><source src="ionlycareaboutyou.mp3" type="audio/mpeg"></audio>
<script>const a=document.getElementById('bgm'),h=document.getElementById('heart'),c=document.getElementById('flipCard');let p=!1;c.onclick=()=>{if(!p){a.play().catch(()=>{});p=!0;h.classList.add('hidden');setTimeout(()=>c.classList.add('flipped'),300)}else{if(c.classList.contains('flipped')){c.classList.remove('flipped');setTimeout(()=>h.classList.remove('hidden'),400)}else{h.classList.add('hidden');setTimeout(()=>c.classList.add('flipped'),300)}}}</script>
</body>
</html>
